#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "invoiceshelf"
name = "InvoiceShelf"
description.en = "Invoicing Solution for Individuals & Businesses"
description.fr = "Solution de facturation pour les particuliers et les entreprises"

version = "2.4.2~ynh1"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "AGPL-3.0"
website = "https://invoiceshelf.com"
userdoc = "https://docs.invoiceshelf.com/"
code = "https://github.com/InvoiceShelf/InvoiceShelf"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/InvoiceShelf/InvoiceShelf/releases/download/2.4.2/InvoiceShelf.zip"
    sha256 = "24277665597a013e7467c31cd7634852ab98491cc6b0cf616552c675d1eeace6"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "InvoiceShelf.zip"

    [resources.system_user]
    allow_email = true
    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"
    api.url = "/api/*"
    api.allowed = ["visitors", "all_users"]
    api.show_tile = false
    api.protected = true
    api.auth_header = true

    [resources.apt]
    packages = "postgresql, postgresql-contrib, redis-server, php8.4-pgsql, php8.4-bcmath, php8.4-curl, php8.4-dom, php8.4-mbstring, php8.4-tokenizer, php8.4-zip, php8.4-xml, php8.4-json, php8.4-exif, php8.4-gd, php8.4-pdo"

    [resources.database]
    type = "postgresql"
